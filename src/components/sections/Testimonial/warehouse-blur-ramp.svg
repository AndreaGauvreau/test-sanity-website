    <linearGradient id="ramp" gradientUnits="userSpaceOnUse" x1="12.18" y1="720.98" x2="1668.82" y2="-26.98">
      <stop offset="0.054404" stop-opacity="0"/>
      <stop offset="0.84456"/>
    </linearGradient>
  </defs>
  <rect width="1681" height="694" fill="url(#ramp)"/>
</svg>
