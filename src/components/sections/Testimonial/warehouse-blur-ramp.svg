<svg xmlns="http://www.w3.org/2000/svg" width="1681" height="694" viewBox="0 0 1681 694" preserveAspectRatio="none">
  <!-- Masque du flou progressif (Figma 269:336), dans la boîte de la photo : nul en bas à
       gauche, entier en haut à droite, sur l'axe du voile (65,70°). -->
